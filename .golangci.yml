version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - exhaustruct
    - gosec
    - forbidigo
    - depguard
  settings:
    depguard:
      rules:
        # internal/metrics is providerd's. Its collectors are created with
        # promauto, which registers on the default registerer at package init —
        # so linking the package is enough to export every one of them, call
        # site or not, and the unlabelled ones then sit at a permanent 0 on a
        # binary that can never write them. A 0 is not neutral: it satisfies
        # ordinary gauge comparisons, so `fred_signer_pool_lane_count < 3`
        # matched every docker-backend and missed the one host with a signer
        # pool (ENG-712).
        #
        # Scoped to the backend side of the fred<->backend boundary, which is
        # where the edge actually appeared: one import, for one panic counter,
        # in internal/backend/docker and internal/backend/k3s. Tests are exempt
        # — internal/backend/router_test.go legitimately asserts on the injected
        # collectors, and a test binary ships nowhere.
        backend-metrics-ownership:
          files:
            - "!$test"
            - "**/internal/backend/**"
            - "**/cmd/docker-backend/**"
            - "**/cmd/k3s-backend/**"
            - "**/cmd/mock-backend/**"
          deny:
            # The $ anchor is load-bearing: pkg is a prefix/regex match, so
            # without it this also denies internal/metrics/background, the
            # subpackage the backends are supposed to import.
            - pkg: github.com/manifest-network/fred/internal/metrics$
              desc: "providerd-owned; a backend binary that links it exports providerd's whole metric set at 0 (ENG-712). Use internal/metrics/background for collectors every binary writes, declare backend-local ones in that backend's metrics.go, or take the collector by injection like backend.RouterConfig.RoutingFallback."
    forbidigo:
      # Managed-volume Create can adopt an existing directory, and Destroy is
      # irreversible. Raw access belongs only at the constructor-owned substrate
      # boundary, where a short-lived Runner brackets the operation and the
      # caller's durable subject determines its scope. Backend retains only read
      # projections and fixed workflow services. The compiler prevents
      # b.volumes.Destroy; this lint rule also prevents a same-package type
      # assertion or a newly retained raw sink from bypassing the boundary.
      forbid:
        - pattern: '\.Destroy$'
          msg: "managed-volume destruction must use the construction-bound substrate mutation executor"
        - pattern: 'volumes\.Create$'
          msg: "managed-volume creation must use the construction-bound substrate mutation executor"
    errcheck:
      check-type-assertions: false  # Too noisy for type assertions
    exhaustruct:
      # Directive-only mode: exclude every type globally so the linter checks
      # ONLY literals explicitly marked //exhaustruct:enforce (the recovered-
      # Provision / ProvisionState construction sites). Keeps the guard off the
      # rest of the repo and all test literals. (ENG-193)
      exclude:
        - '.*'
    gocritic:
      enabled-tags:
        - diagnostic
    misspell:
      locale: US
    gosec:
      # G115 (integer-overflow on conversion) has a very high false-positive
      # rate; every site flagged in this repo is bounded/validated (manifest
      # port specs 1-65535, file modes masked with ModePerm, clamped page
      # limits, chain-derived SKU counts, lossless int64<->uint64 time
      # round-trips). G104 (unhandled errors) duplicates errcheck, which is
      # enabled above and already tuned for this repo. Exclude both rule-wide.
      excludes:
        - G115
        - G104
  exclusions:
    rules:
      # The only production file allowed to invoke the raw volume writer. It
      # captures that writer during composition and exposes only subject-bound
      # or fixed background workflows; no request handler receives the sink.
      - path: ^internal/backend/docker/storage_mutation_guard\.go$
        linters:
          - forbidigo
      # Exclude test files from strict linters
      - path: _test\.go
        linters:
          - forbidigo
          - errcheck
          - unparam
          - unused
          - gocritic
          - errorlint
          - misspell
          - gosec
      # Exclude cmd tools from strict linters
      - path: ^cmd/
        linters:
          - errcheck
          - gocritic
      # Exclude testutil from strict checks
      - path: ^internal/testutil/
        linters:
          - errcheck
      # lifecycle.go tar extraction: ENG-430 (#147) reworked it with os.Root,
      # which structurally eliminated the path-traversal findings (G304/G305).
      # The remaining G110 is the per-entry io.Copy, bounded by the maxBytes cap
      # (verified non-exploitable). Suppressed via config (not an inline comment)
      # so the line isn't pulled into the PR diff and re-flagged by CodeQL.
      - path: ^internal/backend/docker/lifecycle\.go$
        linters:
          - gosec
        text: "G110:"
      # Volume drivers shell out to btrfs/xfs/zfs and read per-volume metadata
      # files by design. Every exec uses a constant binary with discrete argv
      # (no shell -> no command injection), and every path is rooted at the
      # trusted provider-config dataPath; the only tenant-influenced segment
      # (service name) is regex-validated (serviceNameRe, a DNS label), so no
      # traversal or flag-injection is possible. Verified non-exploitable.
      - path: internal/backend/docker/volume_.*\.go
        linters:
          - gosec
        text: "G204|G304"
      # mock-backend is a dev/test harness (not the production daemon); its
      # opt-in InsecureSkipVerify (off by default, MOCK_BACKEND_TLS_SKIP_VERIFY-
      # gated) is intentional for local self-signed-cert testing. Suppress G402
      # via config rather than an inline nolint: that line also carries a CodeQL
      # go/disabled-certificate-check alert, and editing it would make CodeQL
      # re-attribute the pre-existing alert as "new in this PR".
      - path: ^cmd/mock-backend/
        linters:
          - gosec
        text: "G402"
      # Exclude deprecated API warnings from dependencies we can't control
      - linters:
          - staticcheck
        text: "SA1019"
      # Exclude error comparisons for sentinel errors
      - linters:
          - errorlint
        text: "comparing with"
      # Exclude staticcheck style suggestions
      - linters:
          - staticcheck
        text: "ST1023|S1000|QF1003"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/manifest-network/fred

output:
  formats:
    text:
      path: stdout
