name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Test
        # -short skips the load/stress and benchmark-style tests (guarded by
        # testing.Short()): the 100K-event stress test is timing-flaky in CI and
        # the race-stress tests OOM the runner. They still run locally / on demand.
        # -race is also omitted here due to runner memory; run
        # `go test -race -short ./...` locally before pushing concurrency changes.
        run: go test -short -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Read the pin from .golangci-lint-version so CI and `make lint` cannot drift.
      # Fail closed on a missing/empty pin: golangci-lint-action treats an empty
      # `version` input exactly like "latest" (parseVersion("") == parseVersion("latest")
      # == null), so passing one through would silently unpin CI's linter.
      - name: Read pinned golangci-lint version
        id: golangci
        run: |
          version="$(cat .golangci-lint-version)"
          if [ -z "$version" ]; then
            echo "::error::.golangci-lint-version is empty; refusing to lint with an unpinned golangci-lint."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: ${{ steps.golangci.outputs.version }}

  # Guards the ENG-509 supply-chain fix: the release job holds `id-token: write`
  # + `packages: write`, and GitHub scopes permissions per job, so any action it
  # runs inherits the signing and publish identity. A floating tag (`@v4`) is
  # attacker-mutable; a 40-char commit SHA is not. Fail closed so a new workflow
  # step cannot quietly reintroduce one.
  actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every `uses:` must be pinned to a 40-char commit SHA
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows/ \
            | grep -vE 'uses: [^@]+@[0-9a-f]{40}([[:space:]]+#.*)?$' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::unpinned GitHub Action(s) — pin to a 40-char commit SHA with a '# vX.Y.Z' comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "all $(grep -rcE '^[[:space:]]*(- )?uses:' .github/workflows/ | awk -F: '{n+=$2} END{print n}') action references are SHA-pinned"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        # Fail on any CALLED vulnerability whose ID is not in the allowlist
        # (.github/govulncheck-allowlist.txt). This keeps a real signal: new or
        # unexpected vulns break CI, while documented, accepted exceptions (no
        # upstream fix, or a fix blocked by docker/compose v2 compatibility) are
        # tolerated. Replaces the previous blanket exit-3 suppression. See ENG-415.
        run: |
          # GitHub Actions runs this step with `bash -eo pipefail`; disable
          # errexit so the expected govulncheck exit-3 (vulnerabilities found)
          # is handled by the comparison below instead of aborting the step.
          set +e
          allowlist=".github/govulncheck-allowlist.txt"
          if [ ! -f "$allowlist" ]; then
            echo "::error::govulncheck allowlist not found: $allowlist"
            exit 1
          fi
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT

          govulncheck ./... | tee "$report"
          pipestatus=("${PIPESTATUS[@]}")
          status=${pipestatus[0]}
          # Fail closed if tee could not record the report: the comparison below
          # reads $report, and gating on a truncated/empty report would bias
          # toward a false PASS (the unsafe direction for a deny gate).
          if [ "${pipestatus[1]}" -ne 0 ]; then
            echo "::error::failed to write govulncheck report (tee exit ${pipestatus[1]}); refusing to gate on an incomplete report."
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "govulncheck: no vulnerabilities found."
            exit 0
          fi
          if [ "$status" -ne 3 ]; then
            echo "::error::govulncheck failed to run (exit $status)."
            exit "$status"
          fi

          # exit 3 => called vulnerabilities found. Compare the called set
          # (the numbered "Vulnerability #N:" headers — informational, non-called
          # findings are intentionally excluded) against the allowlist.
          called="$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' "$report" | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u)"
          # Fail closed if exit 3 parsed zero headers. exit 3 guarantees >=1
          # CALLED vuln, so an empty $called means the report format changed and
          # the parse silently missed everything — which would otherwise sail
          # through to a false PASS (empty $called => empty $unexpected). Treat a
          # parse that contradicts the exit code as a gate failure.
          if [ -z "$called" ]; then
            echo "::error::govulncheck exited 3 but no 'Vulnerability #N: GO-...' headers were parsed; the report format may have changed. Failing closed."
            exit 1
          fi
          allowed="$(grep -oE 'GO-[0-9]+-[0-9]+' "$allowlist" | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$called") <(printf '%s\n' "$allowed") | grep -E 'GO-' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::govulncheck found vulnerabilities not in $allowlist:"
            printf '%s\n' "$unexpected" | sed 's/^/  /'
            echo "Bump the dependency to a fixed version, or — if no fix is reachable —"
            echo "add the ID to $allowlist with a justification."
            exit 1
          fi

          echo "::notice::All called vulnerabilities are allowlisted (see $allowlist)."
          exit 0
