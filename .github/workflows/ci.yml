name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        # -short skips the load/stress and benchmark-style tests (guarded by
        # testing.Short()): the 100K-event stress test is timing-flaky in CI and
        # the race-stress tests OOM the runner. They still run locally / on demand.
        # Race instrumentation runs separately in bounded shards below.
        run: go test -short -v -coverprofile=coverage.out ./...

      - name: Report coverage and enforce regression floor
        run: python3 scripts/check-coverage.py coverage.out

      - name: Smoke-test callback replay benchmark
        # Benchmarks do not run in the test step. One iteration validates the
        # replay fixture and worker fan-out without seeding the largest backlog.
        run: go test -run '^$' -bench '^BenchmarkCallbackOutboxReplayBacklog$/^leases=(1|128)$' -benchtime=1x ./internal/backend/shared

      - name: Smoke-test retention health benchmark
        # Keep the identity-bound fixture executable as journal schemas evolve.
        # Timing under CI is diagnostic, not a deployment latency assertion.
        run: go test -run '^$' -bench '^BenchmarkRetentionHealth$/^rows=(0|871)$' -benchtime=1x ./internal/backend/shared

      - name: Callback health benchmark smoke
        run: go test -run '^$' -bench '^BenchmarkCallbackHealth$/^closed=(0|1024)$' -benchtime=1x ./internal/backend/shared

      - name: Preserve coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statement-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Test delivery checks
        run: python3 -m unittest discover -s scripts -p '*_test.py'

  release-snapshot:
    name: release configuration + snapshot
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: 2
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release archives and image without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean --parallelism 1 --skip=publish,sign,sbom

  race:
    name: race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [provisioner, backend, other]
    env:
      # Bound compiler/test concurrency and Go's heap target on standard runners.
      # -short keeps large stress fixtures out of race-instrumented processes.
      GOMAXPROCS: "2"
      GOMEMLIMIT: 4GiB
      RACE_SHARD: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        shell: bash
        run: |
          # Partition every package structurally. New helpers automatically
          # retain race coverage when moved outside the two large subtrees.
          module="$(go list -m)"
          all_packages="$(go list ./...)"
          packages=()
          while IFS= read -r package; do
            case "$package" in
              "$module/internal/provisioner"|"$module/internal/provisioner/"*) shard=provisioner ;;
              "$module/internal/backend"|"$module/internal/backend/"*) shard=backend ;;
              *) shard=other ;;
            esac
            if [ "$shard" = "$RACE_SHARD" ]; then
              packages+=("$package")
            fi
          done <<< "$all_packages"
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::race shard selected no packages"
            exit 1
          fi
          go test -race -short -p 1 -timeout 15m "${packages[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Read the pin from .golangci-lint-version so CI and `make lint` cannot drift.
      # Fail closed on a missing/empty pin: golangci-lint-action treats an empty
      # `version` input exactly like "latest" (parseVersion("") == parseVersion("latest")
      # == null), so passing one through would silently unpin CI's linter.
      - name: Read pinned golangci-lint version
        id: golangci
        run: |
          version="$(cat .golangci-lint-version)"
          if [ -z "$version" ]; then
            echo "::error::.golangci-lint-version is empty; refusing to lint with an unpinned golangci-lint."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

  # Guards the ENG-509 supply-chain fix: the release job holds `id-token: write`
  # + `packages: write`, and GitHub scopes permissions per job, so any action it
  # runs inherits the signing and publish identity. A floating tag (`@v4`) is
  # attacker-mutable; a 40-char commit SHA is not. Fail closed so a new workflow
  # step cannot quietly reintroduce one.
  actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: External actions must be pinned; local workflows use the current commit
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows/ \
            | grep -vE 'uses: ([^@]+@[0-9a-f]{40}|\./\.github/workflows/[A-Za-z0-9_-]+\.ya?ml)([[:space:]]+#.*)?$' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::unpinned GitHub Action(s) — pin to a 40-char commit SHA with a '# vX.Y.Z' comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "all $(grep -rcE '^[[:space:]]*(- )?uses:' .github/workflows/ | awk -F: '{n+=$2} END{print n}') action references are SHA-pinned or local to this commit"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        # Fail on any CALLED vulnerability whose ID is not in the allowlist
        # (.github/govulncheck-allowlist.txt). This keeps a real signal: new or
        # unexpected vulns break CI, while documented, accepted exceptions (no
        # upstream fix, or a fix blocked by docker/compose v2 compatibility) are
        # tolerated. Replaces the previous blanket exit-3 suppression. See ENG-415.
        run: |
          # GitHub Actions runs this step with `bash -eo pipefail`; disable
          # errexit so the expected govulncheck exit-3 (vulnerabilities found)
          # is handled by the comparison below instead of aborting the step.
          set +e
          allowlist=".github/govulncheck-allowlist.txt"
          if [ ! -f "$allowlist" ]; then
            echo "::error::govulncheck allowlist not found: $allowlist"
            exit 1
          fi
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT

          govulncheck ./... | tee "$report"
          pipestatus=("${PIPESTATUS[@]}")
          status=${pipestatus[0]}
          # Fail closed if tee could not record the report: the comparison below
          # reads $report, and gating on a truncated/empty report would bias
          # toward a false PASS (the unsafe direction for a deny gate).
          if [ "${pipestatus[1]}" -ne 0 ]; then
            echo "::error::failed to write govulncheck report (tee exit ${pipestatus[1]}); refusing to gate on an incomplete report."
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "govulncheck: no vulnerabilities found."
            exit 0
          fi
          if [ "$status" -ne 3 ]; then
            echo "::error::govulncheck failed to run (exit $status)."
            exit "$status"
          fi

          # exit 3 => called vulnerabilities found. Compare the called set
          # (the numbered "Vulnerability #N:" headers — informational, non-called
          # findings are intentionally excluded) against the allowlist.
          called="$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' "$report" | grep -oE 'GO-[0-9]+-[0-9]+' | sort -u)"
          # Fail closed if exit 3 parsed zero headers. exit 3 guarantees >=1
          # CALLED vuln, so an empty $called means the report format changed and
          # the parse silently missed everything — which would otherwise sail
          # through to a false PASS (empty $called => empty $unexpected). Treat a
          # parse that contradicts the exit code as a gate failure.
          if [ -z "$called" ]; then
            echo "::error::govulncheck exited 3 but no 'Vulnerability #N: GO-...' headers were parsed; the report format may have changed. Failing closed."
            exit 1
          fi
          allowed="$(grep -oE 'GO-[0-9]+-[0-9]+' "$allowlist" | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$called") <(printf '%s\n' "$allowed") | grep -E 'GO-' || true)"

          if [ -n "$unexpected" ]; then
            echo "::error::govulncheck found vulnerabilities not in $allowlist:"
            printf '%s\n' "$unexpected" | sed 's/^/  /'
            echo "Bump the dependency to a fixed version, or — if no fix is reachable —"
            echo "add the ID to $allowlist with a justification."
            exit 1
          fi

          echo "::notice::All called vulnerabilities are allowlisted (see $allowlist)."
          exit 0
