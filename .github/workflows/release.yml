name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; the release job elevates only what it needs.
permissions:
  contents: read

jobs:
  # Green-CI gate: re-run the core checks against the exact tagged commit so we
  # never publish (and sign) artifacts from code that doesn't build/test/lint
  # clean. The integration + govulncheck gates already ran when the commit
  # merged to main; this is the fast, release-blocking subset.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -short ./...
      # Fail closed on a missing/empty pin — an empty `version` input makes
      # golangci-lint-action install "latest", silently unpinning the release gate.
      - name: Read pinned golangci-lint version
        id: golangci
        run: |
          version="$(cat .golangci-lint-version)"
          if [ -z "$version" ]; then
            echo "::error::.golangci-lint-version is empty; refusing to lint with an unpinned golangci-lint."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload artifacts
      packages: write # push the container image to ghcr.io
      id-token: write # cosign keyless signing (Sigstore Fulcio/Rekor OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Tools GoReleaser shells out to: cosign (keyless signing) and syft (SBOMs).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
