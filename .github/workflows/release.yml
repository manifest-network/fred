name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; the release job elevates only what it needs.
permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require tagged commit in main history
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/check-release-source.sh

  # Reuse the complete gates on the exact tagged commit. A prior main/PR run
  # does not establish that this tag passed integration, race or vulnerability checks.
  verify:
    needs: provenance
    uses: ./.github/workflows/ci.yml

  integration:
    needs: provenance
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  release:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload artifacts
      packages: write # push the container image to ghcr.io
      id-token: write # cosign keyless signing (Sigstore Fulcio/Rekor OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Tools GoReleaser shells out to: cosign (keyless signing) and syft (SBOMs).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
