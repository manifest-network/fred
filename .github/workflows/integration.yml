name: Integration Tests

# Runs the `-tags integration` suites that need a privileged environment
# (root + btrfs loopback + a real Docker daemon) and therefore never ran in
# `ci.yml`. Without this, the volume/quota and retain/restore tests rot
# silently — a volume-naming change went undetected for ~3 months (PR #115,
# ENG-330). The whole point is *signal*: this workflow FAILS (it does not pass
# green) if the privileged environment is missing and the tests would `t.Skip`.

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Test runtime dependencies structurally: moving a helper into a new
      # package must not make dependency-only changes skip integration.
      - "internal/**"
      - "cmd/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration.yml"
      # Evaluated last, so it wins: a docs-only change under the dirs above
      # (e.g. internal/backend/docker/README.md) does not run the suite. A change
      # touching any non-.md file still matches a positive pattern and runs.
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      # Test runtime dependencies structurally: moving a helper into a new
      # package must not make dependency-only changes skip integration.
      - "internal/**"
      - "cmd/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration.yml"
      # Evaluated last, so it wins: a docs-only change under the dirs above
      # (e.g. internal/backend/docker/README.md) does not run the suite. A change
      # touching any non-.md file still matches a positive pattern and runs.
      - "!**/*.md"
  # Nightly safety net: catches rot from changes outside the path filter
  # and from GitHub runner-image drift.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Include event_name so a nightly `schedule` run and a `push` to main (both ref
  # refs/heads/main) don't cancel each other; PR pushes to the same ref still
  # supersede stale in-progress runs.
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-btrfs:
    # The job id stays `docker-btrfs` so `needs:` references keep working. The
    # display name (and therefore the status-check name) carries the store.
    name: docker + btrfs integration (root, ${{ matrix.image_store }})
    # MUST be the full ubuntu image (not ubuntu-slim): we need passwordless
    # sudo→root, loop devices, and low-level mount — ubuntu-slim's job container
    # is unprivileged and cannot do any of that.
    # Keep the distribution aligned with the pinned Docker APT package below.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # One store failing must not cancel the other: each leg is its own signal.
      fail-fast: false
      matrix:
        # overlay2 is the classic store every deployed host runs
        # (manifest-deploy roles/common/templates/daemon.json.j2); containerd
        # keeps index/platform-manifest admission covered.
        image_store: [overlay2, containerd]
    env:
      DOCKER_ENGINE_VERSION: "29.7.2"
      # Read by the daemon.json step, the preflight, the run step and the
      # in-suite guard TestIntegration_Docker_ImageStoreMatchesRunnerDeclaration.
      FRED_TEST_IMAGE_STORE: ${{ matrix.image_store }}
      # Optional Docker Hub auth to dodge anonymous pull rate limits (ubuntu-24.04
      # ships zero preloaded images, so every workload image is pulled fresh).
      # Absent secrets evaluate to "" and the login step is skipped — anonymous
      # pulls still work, just rate-limited. On fork PRs secrets are never exposed,
      # so those pulls are always anonymous; the nightly/post-merge run is the backstop.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install supported Docker Engine
        # The stock runner can ship Docker 28.0/API 1.48. Admission needs API
        # 1.49+, and the leg's image store must be selected explicitly.
        # Upgrade the system service: SDK fixtures use /var/run/docker.sock,
        # so a separate Docker context/DOCKER_HOST would test another daemon.
        # Ubuntu's runner removes the Docker APT source after image creation.
        # Switching stores hides images pulled under the other one; the
        # pre-pull step below runs after the switch.
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update
          docker_package_version="5:${DOCKER_ENGINE_VERSION}-1~ubuntu.24.04~noble"
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            "docker-ce=$docker_package_version" "docker-ce-cli=$docker_package_version" containerd.io
          # sudo resets the environment, so pass the leg's store through explicitly.
          sudo env "FRED_TEST_IMAGE_STORE=$FRED_TEST_IMAGE_STORE" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          store = os.environ["FRED_TEST_IMAGE_STORE"]
          features = config.get("features", {})
          if store == "containerd":
              features["containerd-snapshotter"] = True
              config.pop("storage-driver", None)
          elif store == "overlay2":
              # Mirror manifest-deploy roles/common/templates/daemon.json.j2:
              # it pins "storage-driver": "overlay2" and sets no
              # containerd-snapshotter feature, so Docker 29 selects the
              # classic graphdriver store because a graphdriver is configured.
              features.pop("containerd-snapshotter", None)
              config["storage-driver"] = "overlay2"
          else:
              raise SystemExit(f"unknown FRED_TEST_IMAGE_STORE {store!r}")
          if features:
              config["features"] = features
          else:
              config.pop("features", None)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config) + "\n")
          print(json.dumps(config, indent=2, sort_keys=True))
          PY
          sudo systemctl restart docker
          docker --host unix:///var/run/docker.sock version
          test "$(docker --host unix:///var/run/docker.sock version --format '{{.Server.Version}}')" = "$DOCKER_ENGINE_VERSION"

      - name: Install btrfs-progs
        # mkfs.btrfs / btrfs are NOT preinstalled on ubuntu-latest; util-linux
        # (losetup, mount) already is. The tests build their own btrfs loopback.
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          sudo modprobe btrfs || true

      - name: Install ZFS
        # zfsutils-linux provides the zpool/zfs userland; the zfs kernel module
        # ships with the ubuntu-latest runner kernel and is loaded via modprobe.
        # The ZFS Usage/quota tests (volume_zfs.go) build their own file-backed
        # zpool. A modprobe/setup failure is caught by the preflight below — the
        # point is to fail loudly, never silently t.Skip (ENG-330). xfsprogs
        # (mkfs.xfs / xfs_quota) is already preinstalled on ubuntu-latest.
        run: |
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs || true

      - name: Preflight — fail loudly if the privileged env is missing
        # setupBtrfsLoopback (and the Docker-ping helpers) call t.Skip when root,
        # btrfs-progs, loop devices, or Docker are absent — which would make this
        # whole job pass green while testing NOTHING (the ENG-330 trap). Reproduce
        # the exact loopback path here so a broken runner fails fast and clearly.
        run: |
          set -uo pipefail
          fail=0
          docker info >/dev/null 2>&1 || { echo "::error::Docker daemon not reachable"; fail=1; }
          docker_api="$(docker --host unix:///var/run/docker.sock version --format '{{.Server.APIVersion}}')" || fail=1
          if ! dpkg --compare-versions "$docker_api" ge 1.49; then
            echo "::error::Docker API 1.49+ is required for image admission (got $docker_api)"; fail=1
          fi
          # Assert the leg's declared store with the same predicates as
          # daemonUsesContainerd / requireBoundedImageStore
          # (internal/backend/docker/image_capacity.go): containerd means the
          # driver name contains "snapshotter" or any two-element DriverStatus
          # value contains "containerd".
          driver="$(docker --host unix:///var/run/docker.sock info --format '{{.Driver}}')" || driver=""
          driver_status="$(docker --host unix:///var/run/docker.sock info --format '{{json .DriverStatus}}')" || driver_status="null"
          uses_containerd="$(printf '%s' "$driver_status" | jq -r --arg driver "$driver" \
            '($driver | contains("snapshotter")) or ((. // []) | any(.[]; length == 2 and (.[1] | type == "string") and (.[1] | contains("containerd"))))')" || uses_containerd=""
          echo "Docker image store: driver=$driver containerd=$uses_containerd status=$driver_status (declared $FRED_TEST_IMAGE_STORE)"
          case "$FRED_TEST_IMAGE_STORE" in
            containerd)
              if [ "$driver" != overlayfs ] || [ "$uses_containerd" != true ]; then
                echo "::error::The containerd overlayfs image store is required to exercise platform-manifest admission (driver=$driver, containerd=$uses_containerd)"; fail=1
              fi
              ;;
            overlay2)
              if [ "$driver" != overlay2 ] || [ "$uses_containerd" != false ]; then
                echo "::error::The classic overlay2 image store deployed hosts run is required (driver=$driver, containerd=$uses_containerd)"; fail=1
              fi
              # overlay2 needs a backing filesystem with d_type support.
              if ! printf '%s' "$driver_status" | jq -e '(. // []) | any(.[]; .[0] == "Supports d_type" and .[1] == "true")' >/dev/null; then
                echo "::error::The overlay2 backing filesystem lacks d_type support"; fail=1
              fi
              ;;
            *)
              echo "::error::unknown FRED_TEST_IMAGE_STORE '$FRED_TEST_IMAGE_STORE'"; fail=1
              ;;
          esac
          command -v mkfs.btrfs >/dev/null 2>&1 || { echo "::error::mkfs.btrfs not installed"; fail=1; }
          command -v btrfs >/dev/null 2>&1 || { echo "::error::btrfs CLI not installed"; fail=1; }
          work="$(mktemp -d)"
          truncate -s 256M "$work/btrfs.img" || { echo "::error::truncate failed"; fail=1; }
          sudo mkfs.btrfs -f "$work/btrfs.img" >/dev/null || { echo "::error::mkfs.btrfs failed"; fail=1; }
          sync
          mkdir -p "$work/mnt"
          if sudo mount -o loop "$work/btrfs.img" "$work/mnt"; then
            sudo btrfs quota enable "$work/mnt" || { echo "::error::btrfs quota enable failed"; fail=1; }
            sudo umount -l "$work/mnt" || true
          else
            echo "::error::loopback btrfs mount failed — the volume/restore tests would t.Skip (ENG-330 silent-rot gap). Failing."
            fail=1
          fi
          # XFS: tooling is preinstalled; the XFS tests build their own >300MB
          # loopback (xfsprogs refuses <300MB). Presence check only.
          command -v mkfs.xfs >/dev/null 2>&1 || { echo "::error::mkfs.xfs not installed"; fail=1; }
          command -v xfs_quota >/dev/null 2>&1 || { echo "::error::xfs_quota not installed"; fail=1; }
          # ZFS: userland + a loadable module + a file-backed pool round-trip, so a
          # missing/unloadable ZFS env fails loudly here instead of t.Skip in-suite.
          command -v zpool >/dev/null 2>&1 || { echo "::error::zpool not installed"; fail=1; }
          command -v zfs >/dev/null 2>&1 || { echo "::error::zfs CLI not installed"; fail=1; }
          lsmod | grep -q '^zfs ' || sudo modprobe zfs || { echo "::error::zfs kernel module not loadable"; fail=1; }
          if truncate -s 512M "$work/zfs.img"; then
            zpool_name="fredpreflight$$"
            mkdir -p "$work/zmnt"
            # -m "$work/zmnt": mirror setupZFSPool's `zpool create -m mountPath`
            # (exercise the exact code path) AND keep the mount inside $work so a
            # suppressed `zpool destroy` failure can't leak a root-level /$pool mount.
            if sudo zpool create -m "$work/zmnt" "$zpool_name" "$work/zfs.img"; then
              sudo zpool destroy "$zpool_name" || true
            else
              echo "::error::file-backed zpool create failed — the ZFS Usage/quota tests would t.Skip (ENG-330 gap). Failing."
              fail=1
            fi
          else
            echo "::error::zfs truncate failed"; fail=1
          fi
          rm -rf "$work" || true
          [ "$fail" -eq 0 ] && echo "Preflight OK: docker ($FRED_TEST_IMAGE_STORE image store) + root + btrfs/xfs/zfs tooling + loopback + quota all available."
          exit "$fail"

      - name: Docker Hub login (optional)
        # Gate on BOTH values: a half-configured secret (username set, token empty)
        # would otherwise run this step and fail the job instead of falling back
        # to anonymous pulls.
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Pre-pull workload images
        # Warm the shared daemon cache and surface any pull/rate-limit failure
        # clearly here rather than mid-suite. (The negative-path test image — a
        # deliberately non-existent tag — is intentionally NOT pre-pulled.)
        run: |
          set -uo pipefail
          for img in busybox:latest alpine:latest redis:7 redis:7-alpine; do
            ok=0
            for attempt in 1 2 3; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull $img failed (attempt $attempt/3), retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then echo "::error::failed to pull $img after 3 attempts"; exit 1; fi
          done

      - name: Run docker + btrfs integration suite (as root)
        # `-run Integration` covers the ENTIRE docker package: core lifecycle,
        # stack, restart/update, reconciler, idempotency, image admission and
        # immutable platform binding, volume/quota, and the
        # ENG-325 retain/restore tests. 30m timeout: the restore tests are slow
        # (multi-minute provision waits) and the default 15m predates them.
        # `sudo -E env PATH=$PATH` preserves the actions/setup-go toolchain that
        # sudo's secure_path would otherwise hide (the containerd idiom); -E
        # also carries FRED_TEST_IMAGE_STORE and FRED_TEST_IMAGE_DATA_PATH.
        run: |
          set -o pipefail
          case "$FRED_TEST_IMAGE_STORE" in
            containerd)
              # containerd.io uses this separately managed content root.
              # Production requires image_data_path explicitly for snapshotter
              # image stores.
              export FRED_TEST_IMAGE_DATA_PATH=/var/lib/containerd
              ;;
            overlay2)
              # Left unset, as in the deployed docker-backend config: the
              # classic store keeps image data under Docker's data root.
              unset FRED_TEST_IMAGE_DATA_PATH
              ;;
            *)
              echo "::error::unknown FRED_TEST_IMAGE_STORE '$FRED_TEST_IMAGE_STORE'"; exit 1
              ;;
          esac
          sudo -E env "PATH=$PATH" make test-integration INTEGRATION_TIMEOUT=30m 2>&1 | tee integration.log

      - name: Guard — fail if any integration test was SKIPPED
        # A green-but-skipped run is the exact failure mode ENG-330 exists to kill.
        # In a correctly provisioned runner, zero integration tests should skip.
        run: |
          set -uo pipefail
          if grep -Eq '^[[:space:]]*--- SKIP:' integration.log; then
            echo "::group::Skipped tests"
            grep -E '^[[:space:]]*--- SKIP:' integration.log || true
            echo "::endgroup::"
            echo "::error::Integration tests were SKIPPED — the runner is missing root/btrfs/loop/docker. A green-but-skipped run is the ENG-330 silent-rot gap. Failing."
            exit 1
          fi
          passed="$(grep -cE '^[[:space:]]*--- PASS:' integration.log || true)"
          echo "Integration tests passed: ${passed:-0}"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::No integration tests executed (0 PASS lines) — check the build tag / -run pattern."
            exit 1
          fi

  k3s:
    name: k3s-backend integration
    # No root/btrfs/Docker needed: the test self-builds the binary into a TempDir
    # and exercises the HTTP + callback path against a fake Fred. Just needs Go.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run k3s-backend integration suite
        run: |
          set -o pipefail
          make test-integration-k3s 2>&1 | tee k3s-integration.log

      - name: Guard — fail if any k3s integration test was SKIPPED
        run: |
          set -uo pipefail
          if grep -Eq '^[[:space:]]*--- SKIP:' k3s-integration.log; then
            grep -E '^[[:space:]]*--- SKIP:' k3s-integration.log || true
            echo "::error::k3s integration tests were SKIPPED (go toolchain missing?). Failing."
            exit 1
          fi
          passed="$(grep -cE '^[[:space:]]*--- PASS:' k3s-integration.log || true)"
          echo "k3s integration tests passed: ${passed:-0}"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::No k3s integration tests executed."
            exit 1
          fi
